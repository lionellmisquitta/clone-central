name: Windows experiment package

on:
  push:
    branches:
      - CHG-001/audio-first-spikes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Verify and package for Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Python experiments
        shell: pwsh
        run: |
          python -m compileall -q experiments tests
          python -m unittest discover -s tests -v
      - name: Build clean Windows archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = Join-Path $env:RUNNER_TEMP 'Clone-Central-Windows-Experiments'
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $dest 'experiments') -Force | Out-Null
          Copy-Item README.md, RUN.md, PLAN.md, START-HERE.txt, MODEL-LIBRARY-README.md, MODEL-LIBRARY.cmd, clone-central.cmd, model_library.py, recorder.py, VOICE-EXPERIMENT.cmd, MUSIC-EXPERIMENT.cmd -Destination $dest
          Copy-Item experiments/voice_clone.py, experiments/separate_music.py -Destination (Join-Path $dest 'experiments')
          $zip = Join-Path $env:RUNNER_TEMP 'Clone-Central-Windows-Experiments.zip'
          Compress-Archive -Path $dest -DestinationPath $zip -Force
          Write-Host "Created $zip"
          Get-Item $zip | Format-List Name,Length
      - uses: actions/upload-artifact@v4
        with:
          name: Clone-Central-Windows-Experiments
          path: ${{ runner.temp }}/Clone-Central-Windows-Experiments.zip
          retention-days: 14
          if-no-files-found: error
